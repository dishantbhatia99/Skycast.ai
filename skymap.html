<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#090d19">
<title>SkyCast Sky Map</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#05070f;color:#f5f7ff;font-family:Arial,Helvetica,sans-serif;overflow:hidden;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.top{position:fixed;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 14px;display:flex;gap:10px;align-items:flex-start;background:linear-gradient(rgba(5,7,15,.85),transparent);pointer-events:none}
.top a{pointer-events:auto;text-decoration:none;color:#ffad66;background:rgba(27,35,52,.92);border-radius:12px;padding:9px 12px;font-size:13px;font-weight:bold;flex:none}
#hud{font-size:12px;line-height:1.55;color:#d6def2;text-shadow:0 1px 3px #000}
.bot{position:fixed;left:0;right:0;bottom:0;padding:26px 10px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(5,7,15,.93) 35%);display:grid;gap:8px}
.r{display:flex;gap:6px;flex-wrap:wrap}
button,select,input{border:0;border-radius:11px;padding:10px 11px;font-size:12px;font-weight:bold;background:rgba(27,35,52,.96);color:#ffca9f}
button.on{background:#ffad66;color:#241408}
input{font-weight:normal;color:#fff;min-width:0;flex:1}
#info{font-size:13px;color:#ffe3c4;min-height:18px}
:focus-visible{outline:2px solid #ffca9f}
</style></head><body>
<canvas id="c"></canvas>
<div class="top"><a href="./">← SkyCast</a><div id="hud">Loading…</div></div>
<div class="bot">
  <div id="info">Drag to look around, pinch to zoom, tap an object. Press Gyro to use your phone as a window to the sky.</div>
  <div class="r">
    <button id="bg" onclick="toggleGyro()">📱 Gyro</button>
    <button onclick="locate()">📍 My location</button>
    <button id="bl" class="on" onclick="tog('lines')">Lines</button>
    <button id="bn" class="on" onclick="tog('names')">Names</button>
    <select id="find" onchange="target=this.value" aria-label="Find an object"><option value="">🔍 Find…</option></select>
  </div>
  <div class="r">
    <button onclick="shift(-1)">−1h</button><input type="datetime-local" id="dt" onchange="setTime()" aria-label="Date and time"><button onclick="shift(1)">+1h</button><button onclick="nowT()">Now</button>
  </div>
</div>
<script src="astro.js"></script>
<script>
const $=id=>document.getElementById(id), D=Math.PI/180;
// [name, RA hours, Dec deg, magnitude] (J2000, approximate)
const S=[["Sirius",6.752,-16.716,-1.46],["Canopus",6.399,-52.696,-0.74],["Arcturus",14.261,19.182,-0.05],["Rigil Kent",14.660,-60.835,-0.01],["Vega",18.616,38.784,0.03],["Capella",5.278,45.998,0.08],["Rigel",5.242,-8.202,0.13],["Procyon",7.655,5.225,0.34],["Betelgeuse",5.919,7.407,0.42],["Achernar",1.629,-57.237,0.46],["Hadar",14.064,-60.373,0.61],["Altair",19.846,8.868,0.76],["Acrux",12.443,-63.099,0.76],["Aldebaran",4.599,16.509,0.85],["Antares",16.490,-26.432,0.96],["Spica",13.420,-11.161,0.97],["Pollux",7.755,28.026,1.14],["Fomalhaut",22.961,-29.622,1.16],["Deneb",20.690,45.280,1.25],["Mimosa",12.795,-59.689,1.25],["Regulus",10.140,11.967,1.35],["Adhara",6.977,-28.972,1.5],["Castor",7.577,31.888,1.58],["Gacrux",12.519,-57.113,1.64],["Shaula",17.560,-37.104,1.62],["Bellatrix",5.419,6.350,1.64],["Elnath",5.438,28.608,1.65],["Miaplacidus",9.220,-69.717,1.67],["Alnilam",5.603,-1.202,1.69],["Alnitak",5.679,-1.943,1.74],["Alioth",12.900,55.960,1.76],["Dubhe",11.062,61.751,1.79],["Mirfak",3.405,49.861,1.8],["Wezen",7.140,-26.393,1.83],["Sargas",17.622,-42.998,1.87],["Kaus Australis",18.403,-34.385,1.85],["Avior",8.375,-59.509,1.86],["Alkaid",13.792,49.313,1.86],["Menkalinan",5.992,44.947,1.9],["Atria",16.811,-69.028,1.92],["Alhena",6.629,16.399,1.93],["Peacock",20.427,-56.735,1.94],["Mirzam",6.378,-17.956,1.98],["Alphard",9.460,-8.659,1.98],["Polaris",2.530,89.264,1.98],["Hamal",2.120,23.462,2.0],["Algieba",10.333,19.842,2.01],["Diphda",0.726,-17.987,2.02],["Mizar",13.399,54.925,2.04],["Nunki",18.921,-26.297,2.05],["Menkent",14.111,-36.370,2.06],["Mirach",1.163,35.621,2.06],["Alpheratz",0.140,29.091,2.06],["Rasalhague",17.582,12.560,2.07],["Kochab",14.845,74.156,2.08],["Saiph",5.796,-9.670,2.06],["Denebola",11.818,14.572,2.14],["Merak",11.031,56.382,2.37],["Phecda",11.897,53.695,2.44],["Megrez",12.257,57.033,3.31],["Almach",2.065,42.330,2.1],["Schedar",0.675,56.537,2.24],["Caph",0.153,59.150,2.27],["Gamma Cas",0.945,60.717,2.47],["Mintaka",5.533,-0.299,2.23],["Sadr",20.370,40.257,2.23],["Eltanin",17.943,51.489,2.23],["Enif",21.736,9.875,2.39],["Scheat",23.063,28.083,2.42],["Markab",23.079,15.205,2.49],["Algenib",0.220,15.184,2.83]];
const LN=[["Betelgeuse","Bellatrix"],["Betelgeuse","Alnitak"],["Bellatrix","Mintaka"],["Alnitak","Alnilam"],["Alnilam","Mintaka"],["Alnitak","Saiph"],["Mintaka","Rigel"],["Saiph","Rigel"],["Alkaid","Mizar"],["Mizar","Alioth"],["Alioth","Megrez"],["Megrez","Phecda"],["Phecda","Merak"],["Merak","Dubhe"],["Dubhe","Megrez"],["Caph","Schedar"],["Schedar","Gamma Cas"],["Acrux","Gacrux"],["Deneb","Sadr"],["Markab","Scheat"],["Scheat","Alpheratz"],["Alpheratz","Algenib"],["Algenib","Markab"]];
const PL={Mercury:['mercury',0,'#c9c9c9',3],Venus:['venus',-4,'#fff3c0',5],Mars:['mars',1,'#ff7b5c',3.5],Jupiter:['jupiter',-2,'#ffd9a0',5],Saturn:['saturn',.7,'#e8d18a',3.5]};
['Sun','Moon',...Object.keys(PL),'Polaris','Sirius','Vega','Arcturus','Betelgeuse','Antares','Canopus'].forEach(n=>{const o=document.createElement('option');o.value=o.textContent=n;$('find').appendChild(o)});

const cv=$('c'),ctx=cv.getContext('2d');
let W=0,H=0,lat=parseFloat(new URLSearchParams(location.search).get('lat')),lon=parseFloat(new URLSearchParams(location.search).get('lon')),place=new URLSearchParams(location.search).get('name')||'';
if(!isFinite(lat)||!isFinite(lon)){lat=19.19;lon=73.19;place='Ambarnath (default)'}
let off=0,az=180,alt=30,hfov=60,gyro=false,sens=null,cur=null,yawOff=0,opt={lines:true,names:true},target='',sel=null,hits=[],gotEv=false;
const now=()=>Date.now()+off;
function resize(){const r=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*r;cv.height=H*r;ctx.setTransform(r,0,0,r,0,0)}
addEventListener('resize',resize);resize();
const fmt=ms=>new Date(ms-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
function setTime(){const t=new Date($('dt').value).getTime();if(!isNaN(t))off=t-Date.now()}
function shift(h){off+=h*36e5;$('dt').value=fmt(now())}
function nowT(){off=0;$('dt').value=fmt(now())}
function tog(k){opt[k]=!opt[k];$(k==='lines'?'bl':'bn').classList.toggle('on',opt[k])}
function say(t){$('info').textContent=t}
function locate(){if(!navigator.geolocation){say('Location is not available on this device.');return}
  navigator.geolocation.getCurrentPosition(p=>{lat=p.coords.latitude;lon=p.coords.longitude;place='My location';say('Using your location.')},()=>say('Location permission denied. Using '+place+'.'),{timeout:10000})}
nowT();

// ---- sensors ----
function onOri(e){if(e.alpha==null)return;gotEv=true;let a=e.alpha;if(e.webkitCompassHeading!=null)a=360-e.webkitCompassHeading;sens=Astro.basisEuler(a,e.beta,e.gamma)}
let evtName='';
async function toggleGyro(){
  if(gyro){removeEventListener(evtName,onOri,true);gyro=false;$('bg').classList.remove('on');
    const L=lookDir(basis());az=L.az;alt=L.alt;say('Gyro off. Drag to look around.');return}
  try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
    if(await DeviceOrientationEvent.requestPermission()!=='granted'){say('Motion permission denied.');return}}}catch(e){say('Could not ask for motion permission.');return}
  evtName='ondeviceorientationabsolute' in window?'deviceorientationabsolute':'deviceorientation';
  gotEv=false;sens=null;cur=null;yawOff=0;addEventListener(evtName,onOri,true);gyro=true;$('bg').classList.add('on');
  say('Hold the phone upright and point it at the sky. Drag sideways to fine-tune the direction.');
  setTimeout(()=>{if(!gotEv)say('No motion-sensor data. Check browser site settings (Motion sensors) or keep using drag.')},1800);
}
function rotZ(B,t){const c=Math.cos(t),s=Math.sin(t),f=v=>[v[0]*c-v[1]*s,v[0]*s+v[1]*c,v[2]];return{r:f(B.r),u:f(B.u),b:f(B.b)}}
function basis(){
  if(gyro&&sens){if(!cur)cur=JSON.parse(JSON.stringify(sens));
    for(const k of['r','u','b'])for(let i=0;i<3;i++)cur[k][i]+=(sens[k][i]-cur[k][i])*.3;
    cur=Astro.ortho(cur);return rotZ(cur,yawOff*D)}
  return Astro.basisLook(az,alt)}
function lookDir(B){const L=[-B.b[0],-B.b[1],-B.b[2]];return{az:(Math.atan2(L[0],L[1])/D+360)%360,alt:Math.asin(Math.max(-1,Math.min(1,L[2])))/D}}

// ---- touch / mouse ----
const P=new Map();let moved=0,t0=0,pd=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;t0=Date.now();if(P.size===2){const[a,b]=[...P.values()];pd=Math.hypot(a.x-b.x,a.y-b.y)}});
cv.addEventListener('pointermove',e=>{const p=P.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
  if(P.size===2){const[a,b]=[...P.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(pd)hfov=Math.max(15,Math.min(100,hfov*pd/d));pd=d;return}
  const k=hfov/W;if(gyro){yawOff+=dx*k}else{az=(az-dx*k+360)%360;alt=Math.max(-89,Math.min(89,alt+dy*k))}});
function up(e){const was=P.has(e.pointerId);P.delete(e.pointerId);pd=0;if(was&&e.type==='pointerup'&&moved<8&&Date.now()-t0<500)tap(e.clientX,e.clientY)}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();hfov=Math.max(15,Math.min(100,hfov*(e.deltaY>0?1.1:.9)))},{passive:false});
function tap(x,y){let best=null,bd=900;for(const h of hits){const d=(h.x-x)**2+(h.y-y)**2;if(d<bd){bd=d;best=h}}sel=best?best.o.name:null;
  if(best){const o=best.o;say(o.name+' · altitude '+o.alt.toFixed(0)+'° · direction '+dirName(o.az)+' '+o.az.toFixed(0)+'°'+(o.type==='moon'?' · '+Math.round(o.illum*100)+'% lit':o.type==='star'?' · magnitude '+o.mag.toFixed(1):'')+(o.alt<0?' · below the horizon':''))}}
const dirName=a=>['N','NE','E','SE','S','SW','W','NW'][Math.round(a/45)%8];

// ---- sky ----
const mix=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
function world(ms){
  const bd=Astro.bodies(ms),L=[];
  const add=(name,type,ra,dec,mag,x)=>{const p=Astro.altaz(ra,dec,ms,lat,lon);L.push(Object.assign({name,type,mag,az:p.az,alt:p.alt},x||{}))};
  add('Sun','sun',bd.sun.ra,bd.sun.dec,-26);
  add('Moon','moon',bd.moon.ra,bd.moon.dec,-12,{illum:bd.moon.illum,wax:bd.moon.elong<180});
  const m=L[1];m.alt-=Math.asin(1/bd.moon.r)/D*Math.cos(m.alt*D);
  for(const n in PL)add(n,'planet',bd[PL[n][0]].ra,bd[PL[n][0]].dec,PL[n][1],{c:PL[n][2],s:PL[n][3]});
  for(const s of S){const q=Astro.precess(s[1]*15,s[2],ms);add(s[0],'star',q.ra,q.dec,s[3])}
  return L}
function drawMoon(o,x,y,r){ctx.save();ctx.translate(x,y);if(!o.wax)ctx.scale(-1,1);
  ctx.fillStyle='#2b3142';ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();
  const k=o.illum;ctx.fillStyle='#f1eee4';ctx.beginPath();ctx.arc(0,0,r,-Math.PI/2,Math.PI/2,false);
  ctx.ellipse(0,0,r*Math.abs(1-2*k),r,0,Math.PI/2,-Math.PI/2,k<.5);ctx.fill();ctx.restore()}
function frame(){
  const ms=now(),B=basis(),f=W/(2*Math.tan(hfov*D/2)),cx=W/2,cy=H/2,list=world(ms),sun=list[0],look=lookDir(B);hits=[];
  const t=Math.max(0,Math.min(1,(sun.alt+18)/24)),top=mix([4,6,14],[47,111,181],t),bot=mix([12,19,40],[143,195,238],t);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgb('+top+')');g.addColorStop(1,'rgb('+bot+')');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const lim=sun.alt>0?-1.5:sun.alt>-6?0:sun.alt>-12?1.5:sun.alt>-18?3:5;
  // ground: horizon is a straight line in this projection
  const r2=B.r[2],u2=B.u[2],b2=B.b[2];ctx.fillStyle='rgba(6,8,16,.9)';ctx.strokeStyle='rgba(255,173,102,.55)';ctx.lineWidth=1.5;ctx.beginPath();
  if(Math.abs(u2)<.01){if(-b2<0)ctx.fillRect(0,0,W,H)}
  else{const y0=x=>cy-f*(b2-r2*((x-cx)/f))/u2,y1=y0(0),y2=y0(W);
    ctx.beginPath();if(u2>0){ctx.moveTo(0,y1);ctx.lineTo(W,y2);ctx.lineTo(W,H+50);ctx.lineTo(0,H+50)}else{ctx.moveTo(0,y1);ctx.lineTo(W,y2);ctx.lineTo(W,-50);ctx.lineTo(0,-50)}
    ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(0,y1);ctx.lineTo(W,y2);ctx.stroke()}
  const pos={};
  for(const o of list){const v=Astro.vec(o.az,o.alt);o.p=Astro.project(v,B,f,cx,cy);pos[o.name]=o}
  // constellation lines
  if(opt.lines){ctx.strokeStyle=sun.alt>-6?'rgba(255,255,255,.10)':'rgba(140,170,255,.38)';ctx.lineWidth=1;ctx.beginPath();
    for(const[a,b]of LN){const A=pos[a],C=pos[b];if(A&&C&&A.p&&C.p&&A.alt>-1&&C.alt>-1&&A.mag<lim&&C.mag<lim){ctx.moveTo(A.p.x,A.p.y);ctx.lineTo(C.p.x,C.p.y)}}ctx.stroke()}
  ctx.font='11px Arial';ctx.textBaseline='middle';
  for(const o of list){const p=o.p;if(!p||o.alt<-1||p.x<-40||p.x>W+40||p.y<-40||p.y>H+40)continue;
    if(o.type==='star'){if(o.mag>=lim)continue;const r=Math.max(.9,3.4-o.mag*.75);ctx.fillStyle='#fff';ctx.globalAlpha=Math.min(1,.55+(lim-o.mag)*.2);ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fill();ctx.globalAlpha=1;
      if(opt.names&&o.mag<2.15){ctx.fillStyle='rgba(205,220,255,.85)';ctx.fillText(o.name,p.x+r+4,p.y)}}
    else if(o.type==='sun'){const gr=ctx.createRadialGradient(p.x,p.y,2,p.x,p.y,34);gr.addColorStop(0,'rgba(255,225,120,.95)');gr.addColorStop(1,'rgba(255,170,60,0)');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(p.x,p.y,34,0,7);ctx.fill();ctx.fillStyle='#ffe27a';ctx.beginPath();ctx.arc(p.x,p.y,10,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.fillText('Sun',p.x+16,p.y)}
    else if(o.type==='moon'){drawMoon(o,p.x,p.y,11);ctx.fillStyle='#fff';ctx.fillText('Moon '+Math.round(o.illum*100)+'%',p.x+16,p.y)}
    else{if(sun.alt>0&&o.mag>-3.5)continue;ctx.fillStyle=o.c;ctx.shadowColor=o.c;ctx.shadowBlur=8;ctx.beginPath();ctx.arc(p.x,p.y,o.s,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ffd9b0';ctx.fillText(o.name,p.x+o.s+5,p.y)}
    hits.push({x:p.x,y:p.y,o});
    if(sel===o.name){ctx.strokeStyle='#ffad66';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(p.x,p.y,18,0,7);ctx.stroke()}}
  // compass letters on the horizon
  ctx.font='bold 14px Arial';ctx.textAlign='center';
  [['N',0],['NE',45],['E',90],['SE',135],['S',180],['SW',225],['W',270],['NW',315]].forEach(([n,a])=>{const p=Astro.project(Astro.vec(a,0),B,f,cx,cy);
    if(p&&p.x>10&&p.x<W-10&&p.y>0&&p.y<H){ctx.fillStyle=n.length===1?'#ffad66':'rgba(255,173,102,.6)';ctx.fillText(n,p.x,p.y-12)}});
  ctx.textAlign='left';
  // find-target guidance
  let guide='';
  if(target&&pos[target]){const o=pos[target],v=Astro.vec(o.az,o.alt),x=Astro.dot(v,B.r),y=Astro.dot(v,B.u),d=-Astro.dot(v,B.b),p=o.p;
    if(p&&p.x>30&&p.x<W-30&&p.y>110&&p.y<H-170){ctx.strokeStyle='#ffad66';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,24+3*Math.sin(Date.now()/250),0,7);ctx.stroke()}
    else{const n=Math.hypot(x,y)||1,ang=Math.atan2(-y/n,x/n),R=Math.min(W,H)*.34;ctx.save();ctx.translate(cx+Math.cos(ang)*R,cy+Math.sin(ang)*R);ctx.rotate(ang);ctx.fillStyle='#ffad66';ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-9,-10);ctx.lineTo(-9,10);ctx.fill();ctx.restore()}
    const da=((o.az-look.az+540)%360)-180,dl=o.alt-look.alt;
    guide='<br>🔍 '+o.name+': turn '+(da>0?'right ':'left ')+Math.abs(da).toFixed(0)+'°, '+(dl>0?'up ':'down ')+Math.abs(dl).toFixed(0)+'°'+(o.alt<0?' (below horizon now)':'')}
  const state=sun.alt>0?'Daytime: stars hidden':sun.alt>-6?'Twilight':sun.alt>-18?'Dusk/dawn':'Night';
  $('hud').innerHTML=place+' · '+lat.toFixed(2)+'°, '+lon.toFixed(2)+'°<br>Facing '+dirName(look.az)+' '+look.az.toFixed(0)+'° · up '+look.alt.toFixed(0)+'° · '+(gyro?(gotEv?'gyro on':'waiting for gyro…'):'drag mode')+'<br>'+state+' (Sun '+sun.alt.toFixed(0)+'°)'+guide;
  requestAnimationFrame(frame)}
frame();
</script></body></html>
