<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050816">
<title>SkyCast AI — 3D Sky Map</title>
<style>
:root{--bg:#050816;--panel:rgba(10,18,42,.82);--line:rgba(150,190,255,.2);--text:#eef5ff;--muted:#a9b9d8;--accent:#7ce7ff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.top{position:fixed;top:env(safe-area-inset-top,10px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.brand,.pill,.panel,.controls button,.planetbar button{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 28px #0004}
.brand{padding:10px 13px;border-radius:16px;pointer-events:auto}.brand b{display:block;font-size:15px;letter-spacing:.3px}.brand small{color:var(--muted);font-size:11px}
.topright{display:flex;gap:7px;pointer-events:auto}.pill{color:var(--text);padding:10px 11px;border-radius:13px;font-size:12px}
.panel{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));border-radius:20px;padding:12px}
.status{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px;font-size:12px;color:var(--muted)}
#mode{color:#9ff5cc}.planetbar{display:flex;gap:8px;overflow-x:auto;padding:1px 0 8px;scrollbar-width:none}.planetbar::-webkit-scrollbar{display:none}
.planetbar button{flex:0 0 auto;color:var(--text);border-radius:14px;padding:8px 11px;font-size:12px;display:flex;align-items:center;gap:7px}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;box-shadow:inset -4px -2px 5px #0008,0 0 10px #fff2}
.controls{display:flex;gap:7px;flex-wrap:wrap}.controls button{color:var(--text);border-radius:12px;padding:10px 11px;font-size:12px;flex:1;min-width:84px}
.controls button.primary{background:linear-gradient(135deg,#176d92dd,#493a92dd);border-color:#75dcff88}
.info{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;font-size:12px}.info strong{font-size:14px}.info span{color:var(--muted)}
#toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);max-width:90%;padding:10px 14px;background:#101a35ed;border:1px solid var(--line);border-radius:14px;font-size:12px;text-align:center;display:none;z-index:4}
#hint{position:fixed;top:78px;left:50%;transform:translateX(-50%);color:#c9d8f4;font-size:11px;background:#081129aa;border:1px solid #ffffff18;padding:7px 10px;border-radius:99px;white-space:nowrap}
@media(min-width:700px){.panel{left:50%;right:auto;transform:translateX(-50%);width:min(760px,calc(100% - 32px));bottom:18px}.top{left:20px;right:20px}.brand b{font-size:17px}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="hint">Move your phone to explore • drag to rotate</div>
<div class="top">
 <div class="brand"><b>🌌 SkyCast AI <span style="color:var(--accent)">3D</span></b><small>Interactive sky explorer</small></div>
 <div class="topright"><button class="pill" id="loc">📍 Location</button><button class="pill" id="full">⛶ Fullscreen</button></div>
</div>
<div id="toast"></div>
<div class="panel">
 <div class="status"><span id="compass">Direction: —</span><span id="mode">● Touch mode</span><span id="coords">Locating…</span></div>
 <div class="planetbar" id="planetbar">
  <button data-body="Sun"><i class="dot" style="background:#ffca62"></i>Sun</button>
  <button data-body="Moon"><i class="dot" style="background:#cdd8eb"></i>Moon</button>
  <button data-body="Mercury"><i class="dot" style="background:#9d9b98"></i>Mercury</button>
  <button data-body="Venus"><i class="dot" style="background:#ffe0a0"></i>Venus</button>
  <button data-body="Earth"><i class="dot" style="background:#2f8dff"></i>Earth</button>
  <button data-body="Mars"><i class="dot" style="background:#e86c4b"></i>Mars</button>
  <button data-body="Jupiter"><i class="dot" style="background:#d9ad83"></i>Jupiter</button>
  <button data-body="Saturn"><i class="dot" style="background:#dfc990"></i>Saturn</button>
  <button data-body="Uranus"><i class="dot" style="background:#8ee8ed"></i>Uranus</button>
  <button data-body="Neptune"><i class="dot" style="background:#4268e8"></i>Neptune</button>
 </div>
 <div class="controls">
  <button class="primary" id="motion">🧭 Enable phone motion</button>
  <button id="compassToggle">🧭 Compass labels</button>
  <button id="labels">✨ Labels: ON</button>
  <button id="reset">↺ Reset view</button>
 </div>
 <div class="info"><div><strong id="selected">Explore the sky</strong><br><span id="description">Tap a planet to focus its 3D model.</span></div><span id="time"></span></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>
<script>
(() => {
const canvas=document.getElementById('scene'), toast=document.getElementById('toast');
function say(t){toast.textContent=t;toast.style.display='block';clearTimeout(say.t);say.t=setTimeout(()=>toast.style.display='none',3500)}
if(!window.THREE){say('3D library did not load. Check your internet connection and refresh.');return}
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x030611);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,3000);camera.position.set(0,0,0);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;
scene.add(new THREE.AmbientLight(0x9db8ff,1.25));
const sunLight=new THREE.PointLight(0xffffff,3,0);sunLight.position.set(0,0,0);scene.add(sunLight);
const starGroup=new THREE.Group();scene.add(starGroup);
const starGeo=new THREE.BufferGeometry(), pts=[], cols=[];
for(let i=0;i<2600;i++){const u=Math.random()*2-1, a=Math.random()*Math.PI*2, r=115, s=Math.sqrt(1-u*u);pts.push(r*s*Math.cos(a),r*u,r*s*Math.sin(a));const c=new THREE.Color().setHSL(.55+Math.random()*.16,.25,.55+Math.random()*.45);cols.push(c.r,c.g,c.b)}
starGeo.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));starGeo.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));
const stars=new THREE.Points(starGeo,new THREE.PointsMaterial({size:.65,vertexColors:true,sizeAttenuation:false}));starGroup.add(stars);
// Soft nebula-like background clouds made of transparent sprites
for(let i=0;i<9;i++){const g=new THREE.BufferGeometry();const arr=[];for(let j=0;j<160;j++){let ang=Math.random()*Math.PI*2,rad=Math.random()*16;arr.push(Math.cos(ang)*rad,Math.sin(ang)*rad,(Math.random()-.5)*2)}g.setAttribute('position',new THREE.Float32BufferAttribute(arr,3));const p=new THREE.Points(g,new THREE.PointsMaterial({color:[0x324a9c,0x5b286e,0x124c71][i%3],size:2.8,transparent:true,opacity:.12,depthWrite:false}));p.position.set((Math.random()-.5)*100,(Math.random()-.5)*65,-85-Math.random()*25);scene.add(p)}
const rig=new THREE.Group();scene.add(rig);
const bodies={}, bodyInfo={
 Sun:['#ffbd45','A glowing star model; visual size is enlarged for visibility.'],
 Moon:['#c9d4e8','Rocky moon model with crater-like surface shading.'],
 Mercury:['#a6a29a','Small rocky planet model.'],
 Venus:['#e9c78b','Cloud-covered planet model.'],
 Earth:['#2878d8','Blue oceans and green land-like patches (illustrative texture).'],
 Mars:['#d96a4e','Red rocky planet model.'],
 Jupiter:['#d4ad8a','Gas giant with banded atmosphere.'],
 Saturn:['#ddca91','Gas giant with visible rings.'],
 Uranus:['#8bdce2','Ice giant with a faint ring.'],
 Neptune:['#4169dd','Deep-blue ice giant model.']
};
function makePlanet(name,color,rad,pos){
 const group=new THREE.Group();group.position.set(...pos);rig.add(group);
 const geo=new THREE.SphereGeometry(rad,48,32);const mat=new THREE.MeshStandardMaterial({color:new THREE.Color(color),roughness:name==='Sun'?.8:.82,metalness:0.02,emissive:name==='Sun'?new THREE.Color(color):new THREE.Color(0x000000),emissiveIntensity:name==='Sun'?1.8:0});
 const mesh=new THREE.Mesh(geo,mat);group.add(mesh);
 // crater/terrain dots
 if(['Moon','Mercury','Mars','Earth'].includes(name)){
  for(let i=0;i<(name==='Moon'?24:12);i++){const cr=new THREE.Mesh(new THREE.SphereGeometry(rad*(.035+Math.random()*.06),12,8),new THREE.MeshStandardMaterial({color:name==='Earth'?(Math.random()>.5?0x3d9a65:0x164a9d):0x514e4a,transparent:true,opacity:.5,roughness:1}));const y=Math.random()*2-1,ang=Math.random()*Math.PI*2,rr=rad*.99,ss=Math.sqrt(1-y*y);cr.position.set(rr*ss*Math.cos(ang),rr*y,rr*ss*Math.sin(ang));cr.scale.set(1,.25,1);group.add(cr)}
 }
 if(name==='Jupiter'||name==='Saturn'){for(let i=0;i<7;i++){const ring=new THREE.Mesh(new THREE.TorusGeometry(rad*(.72+i*.055),rad*.018,5,90),new THREE.MeshBasicMaterial({color:[0xb18a6d,0xe6c8a0,0x98765e][i%3],transparent:true,opacity:.7}));ring.rotation.x=Math.PI/2.3;group.add(ring)}}
 if(name==='Uranus'){const ring=new THREE.Mesh(new THREE.TorusGeometry(rad*1.45,rad*.025,5,90),new THREE.MeshBasicMaterial({color:0x9fe8e8,transparent:true,opacity:.55}));ring.rotation.x=Math.PI/2.1;group.add(ring)}
 const glow=new THREE.Sprite(new THREE.SpriteMaterial({color:new THREE.Color(color),transparent:true,opacity:name==='Sun'?.28:.12,depthWrite:false}));glow.scale.set(rad*5,rad*5,1);group.add(glow);
 const label=makeLabel(name);label.position.set(0,rad+1.25,0);group.add(label);
 bodies[name]={group,mesh,label,rad,base:group.position.clone()};
}
function makeLabel(text){const c=document.createElement('canvas');c.width=256;c.height=64;const x=c.getContext('2d');x.font='bold 28px system-ui';x.textAlign='center';x.fillStyle='#eaf4ff';x.shadowColor='#61b9ff';x.shadowBlur=12;x.fillText(text,128,40);const t=new THREE.CanvasTexture(c);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false}));s.scale.set(4.6,1.15,1);return s}
const positions={Sun:[0,0,-26],Moon:[-8,3,-23],Mercury:[-19,8,-38],Venus:[-13,-5,-31],Earth:[0,-9,-32],Mars:[9,7,-34],Jupiter:[18,2,-47],Saturn:[26,-7,-54],Uranus:[-28,-10,-58],Neptune:[31,10,-65]};
for(const [n,c] of Object.entries(bodyInfo)){const rad={Sun:2.5,Moon:1.25,Mercury:.8,Venus:1.15,Earth:1.3,Mars:1.05,Jupiter:2.2,Saturn:1.9,Uranus:1.45,Neptune:1.4}[n];makePlanet(n,c[0],rad,positions[n])}
let showLabels=true,showCompass=true, selected='';const compassGroup=new THREE.Group();scene.add(compassGroup);
function textSprite(txt,color='#a9e8ff'){const c=document.createElement('canvas');c.width=128;c.height=64;const x=c.getContext('2d');x.font='bold 34px system-ui';x.textAlign='center';x.fillStyle=color;x.fillText(txt,64,42);const tex=new THREE.CanvasTexture(c);const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));sp.scale.set(3,1.5,1);return sp}
[['N',0,0,-55],['S',0,0,55],['E',55,0,0],['W',-55,0,0],['NE',39,0,-39],['NW',-39,0,-39],['SE',39,0,39],['SW',-39,0,39]].forEach(([t,x,y,z])=>{const s=textSprite(t,t==='N'?'#ff9a9a':'#a9e8ff');s.position.set(x,y,z);compassGroup.add(s)});
let yaw=0,pitch=0,targetYaw=0,targetPitch=0,drag=false,lastX=0,lastY=0,deviceMode=false,deviceBase=null,deviceYaw=0,devicePitch=0;
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drag||deviceMode)return;targetYaw-=(e.clientX-lastX)*.005;targetPitch=clamp(targetPitch+(e.clientY-lastY)*.005,-1.35,1.35);lastX=e.clientX;lastY=e.clientY});
canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointercancel',()=>drag=false);
canvas.addEventListener('wheel',e=>{camera.fov=clamp(camera.fov+e.deltaY*.025,32,85);camera.updateProjectionMatrix()},{passive:true});
function updateOrientation(){const q=new THREE.Quaternion();q.setFromEuler(new THREE.Euler(pitch,yaw,0,'YXZ'));camera.quaternion.slerp(q,.16)}
document.getElementById('motion').addEventListener('click',async()=>{
 try{
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){const p=await DeviceOrientationEvent.requestPermission();if(p!=='granted'){say('Motion permission was not granted. Use touch controls.');return}}
  if(!('DeviceOrientationEvent'in window)){say('This browser does not support phone orientation.');return}
  deviceMode=true;document.getElementById('mode').textContent='● Phone motion ON';say('Move your phone slowly to explore the sky.');
  window.addEventListener('deviceorientation',e=>{if(e.alpha==null)return;const alpha=THREE.MathUtils.degToRad(e.alpha),beta=THREE.MathUtils.degToRad(e.beta||0),gamma=THREE.MathUtils.degToRad(e.gamma||0);deviceYaw=-alpha;devicePitch=clamp((beta-Math.PI/2)*.65,-1.35,1.35);targetYaw=deviceYaw;targetPitch=devicePitch;document.getElementById('compass').textContent='Direction: '+Math.round(e.alpha)+'°';},{passive:true});
 }catch(err){say('Phone motion blocked. Open this page in Chrome and allow motion access.')}
});
document.getElementById('full').onclick=async()=>{try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen?.()}else await document.exitFullscreen?.()}catch(e){say('Fullscreen is not available in this browser. Rotate phone to landscape for a wider view.')}};
document.getElementById('loc').onclick=()=>{if(!navigator.geolocation){say('Location is not supported in this browser.');return}navigator.geolocation.getCurrentPosition(p=>{document.getElementById('coords').textContent=p.coords.latitude.toFixed(2)+', '+p.coords.longitude.toFixed(2);say('Location received. Sky layout is an illustrative view, not a precision planetarium.');},()=>say('Location permission denied. You can still explore the map.'),{enableHighAccuracy:true,timeout:8000})};
document.getElementById('labels').onclick=()=>{showLabels=!showLabels;Object.values(bodies).forEach(b=>b.label.visible=showLabels);document.getElementById('labels').textContent='✨ Labels: '+(showLabels?'ON':'OFF')};
document.getElementById('compassToggle').onclick=()=>{showCompass=!showCompass;compassGroup.visible=showCompass;document.getElementById('compassToggle').textContent='🧭 Compass: '+(showCompass?'ON':'OFF')};
document.getElementById('reset').onclick=()=>{targetYaw=targetPitch=yaw=pitch=0;camera.fov=62;camera.updateProjectionMatrix();camera.position.set(0,0,0);deviceMode=false;document.getElementById('mode').textContent='● Touch mode';say('View reset. Drag to rotate or enable phone motion.')};
function focus(name){selected=name;const b=bodies[name];document.getElementById('selected').textContent=name;document.getElementById('description').textContent=bodyInfo[name][1];const p=b.base;targetYaw=Math.atan2(-p.x,-p.z);targetPitch=Math.atan2(p.y,Math.sqrt(p.x*p.x+p.z*p.z));say('Focused on '+name+'. Planet models are enlarged for visibility and are not to scale.')}
document.querySelectorAll('[data-body]').forEach(btn=>btn.addEventListener('click',()=>focus(btn.dataset.body)));
document.getElementById('time').textContent=new Date().toLocaleString([], {weekday:'short',hour:'2-digit',minute:'2-digit'});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function animate(){requestAnimationFrame(animate);yaw+=(targetYaw-yaw)*.12;pitch+=(targetPitch-pitch)*.12;if(!deviceMode)updateOrientation();Object.values(bodies).forEach((b,i)=>{b.mesh.rotation.y+=.0015+(i*.0002);b.group.rotation.y+=.0006;if(b.label) b.label.quaternion.copy(camera.quaternion)});stars.rotation.y+=.00004;renderer.render(scene,camera)}
animate();
})();
</script>
</body>
</html>
